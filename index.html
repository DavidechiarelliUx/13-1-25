<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="text-center">Pratica Con il Grid System</h1>
    <h2 class="text-center">Esercizio 1</h2>
    <div class="container text-white">
      <div class="row text-center border border-3 border-dark p-3 bg-primary">
        <div class="col-md-4 mb-2 border border-1 border-dark">1</div>
        <div class="col-md-4 mb-2 border border-1 border-dark">2</div>
        <div class="col-md-4 mb-2 border border-1 border-dark">3</div>
      </div>
    </div>
    <h2 class="text-center">Esercizio 2</h2>
    <div class="container">
      <div class="row bg-yellow text-center border border-3 border-dark p-3">
        <div class="col-lg-4 border border-1 border-dark">1</div>
        <div class="col-lg-4 border border-1 border-dark">2</div>
        <div class="col-lg-4 border border-1 border-dark">3</div>
      </div>
    </div>
    <h2 class="text-center">Esercizio 3</h2>
    <div class="container text-center">
      <div class="row bg-success p-3 border border-3 border-dark">
        <div class="col-sm-4 border border-1 border-dark">1</div>
        <div class="col-sm-4 border border-1 border-dark">2</div>
        <div class="col-sm-4 border border-1 border-dark">3</div>
      </div>
      <div class="row bg-success p-3 border border-3 border-dark">
        <div class="col-md-4 border border-1 border-dark">1</div>
        <div class="col-md-4 border border-1 border-dark">2</div>
        <div class="col-md-4 border border-1 border-dark">3</div>
      </div>

      <div class="row bg-success p-3 border border-3 border-dark">
        <div class="col-lg-4 border border-1 border-dark">1</div>
        <div class="col-lg-4 border border-1 border-dark">2</div>
        <div class="col-lg-4 border border-1 border-dark">3</div>
      </div>

      <div class="row bg-success p-3 border border-3 border-dark">
        <div class="col-xl-4 border border-1 border-dark">1</div>
        <div class="col-xl-4 border border-1 border-dark">2</div>
        <div class="col-xl-4 border border-1 border-dark">3</div>
      </div>
    </div>
    <h2 class="text-center">Esercizio 4</h2>
    <div class="container">
      <div class="row text-center bg-danger text-white p-3 border border-1 border-dark">
        <div class="col-lg-3 border border-1 border-dark">1</div>
        <div class="col-lg-6 border border-1 border-dark">2</div>
        <div class="col-lg-3 border border-1 border-dark">3</div>
      </div>
    </div>
    <h2 class="text-center">Esercizio 5</h2>
    <div class="container">
      <div class="row text-center text-white p-3 border border-1 border-dark text-center">
        <div class="col-lg-8 bg-primary p-3 border border-1 border-dark">
                <div class="row">
                    <div class="col-lg-6 bg-secondary p-3 border border-1 border-dark">1</div>
                    <div class="col-lg-6 bg-secondary p-3 border border-1 border-dark">2</div>
            </div>
        </div>
        <div class="col-lg-4 bg-primary p-3 border border-1 border-dark">
            <div class="bg-secondary p-3 border border-1 border-dark">2</div></div>
      </div>
    </div>
    <h2 class="text-center"> esercizio 6 </h2>
    <div class="container">
        <div class="row text-center p-3 bg-primary">
            <div class="col-lg-4 p-3 ">
                <div class="bg-secondary p-3 ">1</div>
            </div>
            <div class="col-lg-4 offset-lg-4 p-3 ">
                <div class="bg-secondary p-3 ">2</div>
            </div>
        </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
